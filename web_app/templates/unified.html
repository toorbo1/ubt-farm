<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBT Farm - Генератор + Чат</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            text-align: center;
        }
        header h1 { font-size: 1.5em; }
        .main-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            height: calc(100vh - 60px);
        }
        .generator-panel {
            padding: 20px;
            overflow-y: auto;
        }
        .chat-panel {
            background: #16213e;
            border-left: 2px solid #333;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
        }
        .message.user {
            background: #0f3460;
            margin-left: 20%;
        }
        .message.assistant {
            background: #1a1a2e;
            margin-right: 10%;
        }
        .message .time {
            font-size: 0.8em;
            color: #888;
        }
        .chat-input {
            padding: 15px;
            background: #0f3460;
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #1a1a2e;
            color: #eee;
        }
        .chat-input button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .section {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #333;
            border-radius: 5px;
            background: #0f3460;
            color: #eee;
        }
        button {
            background: #667eea;
            color: white;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        button:hover { background: #5568d3; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .gallery-item img {
            width: 100%;
            height: 267px;
            object-fit: cover;
        }
        .gallery-item video {
            width: 100%;
            height: 267px;
        }
        textarea {
            min-height: 200px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <header>
        <h1>🚀 UBT Farm - Генератор видео + Чат с AI</h1>
    </header>

    <div class="main-container">
        <!-- Левая панель - Генератор -->
        <div class="generator-panel">
            <div class="section">
                <h2>📝 Генерация сценария</h2>
                <input type="text" id="topic" placeholder="Введите тему..." value="космос">
                <button onclick="generateScript()">Сгенерировать сценарий</button>
                <textarea id="scriptText" placeholder="Здесь появится сценарий..."></textarea>
            </div>

            <div class="section">
                <h2>🖼 Генерация картинки</h2>
                <input type="text" id="imgPrompt" placeholder="Промпт для картинки..." value="pixel art cat in space">
                <button onclick="generateImage()">Сгененерировать картинку</button>
            </div>

            <div class="section">
                <h2>🎬 Галерея</h2>
                <div class="gallery" id="gallery"></div>
            </div>
        </div>

        <!-- Правая панель - Чат -->
        <div class="chat-panel">
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="time">🤖 AI</div>
                    Привет! Я помогу с генерацией видео и картинок. Спроси меня о чём угодно!
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Напиши сообщение..." onkeypress="if(event.key==='Enter')sendChat()">
                <button onclick="sendChat()">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        // Генерация сценария
        async function generateScript() {
            const topic = document.getElementById('topic').value;
            try {
                const resp = await fetch('/api/script', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({topic})
                });
                const data = await resp.json();
                document.getElementById('scriptText').value = data.full_text;
            } catch(e) {
                alert('Ошибка: ' + e.message);
            }
        }

        // Генерация картинки
        async function generateImage() {
            const prompt = document.getElementById('imgPrompt').value;
            try {
                const resp = await fetch('/api/image', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt, seed: Math.floor(Math.random()*1000)})
                });
                const data = await resp.json();
                addToGallery(data.path, 'Generated');
            } catch(e) {
                alert('Ошибка: ' + e.message);
            }
        }

        // Добавить в галерею
        function addToGallery(path, label) {
            const gallery = document.getElementById('gallery');
            const item = document.createElement('div');
            item.className = 'gallery-item';
            if (path.startsWith('data:image')) {
                item.innerHTML = `<img src="${path}"><div style="padding:5px;text-align:center;">${label}</div>`;
            } else {
                item.innerHTML = `<video controls><source src="${path}"></video><div style="padding:5px;text-align:center;">${label}</div>`;
            }
            gallery.appendChild(item);
        }

        // Отправка сообщения в чат
        async function sendChat() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;

            // Добавляем сообщение пользователя
            const chatDiv = document.getElementById('chatMessages');
            chatDiv.innerHTML += `
                <div class="message user">
                    <div class="time">${new Date().toLocaleTimeString()} 👤</div>
                    ${message}
                </div>
            `;
            input.value = '';
            chatDiv.scrollTop = chatDiv.scrollHeight;

            // Отправляем в API
            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message})
                });
                const data = await resp.json();

                // Добавляем ответ AI
                chatDiv.innerHTML += `
                    <div class="message assistant">
                        <div class="time">${new Date().toLocaleTimeString()} 🤖 AI</div>
                        ${data.response}
                    </div>
                `;
                chatDiv.scrollTop = chatDiv.scrollHeight;
            } catch(e) {
                chatDiv.innerHTML += `
                    <div class="message assistant">
                        <div class="time">Ошибка</div>
                        Не удалось получить ответ
                    </div>
                `;
            }
        }

        // Загрузка истории чата
        async function loadChatHistory() {
            try {
                const resp = await fetch('/api/chat/history');
                const data = await resp.json();
                const chatDiv = document.getElementById('chatMessages');
                chatDiv.innerHTML = '';
                data.messages.forEach(m => {
                    const icon = m.role === 'user' ? '👤' : '🤖 AI';
                    chatDiv.innerHTML += `
                        <div class="message ${m.role}">
                            <div class="time">${m.time} ${icon}</div>
                            ${m.content}
                        </div>
                    `;
                });
            } catch(e) {}
        }

        // При загрузке
        window.addEventListener('DOMContentLoaded', loadChatHistory);
    </script>
</body>
</html>
