<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBT Farm - Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            text-align: center;
        }
        header h1 { font-size: 2em; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #333;
            border-radius: 5px;
            background: #0f3460;
            color: #eee;
        }
        button {
            background: #667eea;
            color: white;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        button:hover { background: #5568d3; }
        .log-box {
            background: #0a0a0a;
            color: #00ff00;
            font-family: monospace;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            border-radius: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th { background: #0f3460; }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .status.success { background: #28a745; }
        .status.error { background: #dc3545; }
    </style>
</head>
<body>
    <header>
        <h1>🚀 UBT Farm Admin Panel</h1>
        <p>Полный контроль над проектом</p>
    </header>

    <div class="container">
        <div class="grid">
            <!-- API Keys -->
            <div class="card">
                <h2>🔑 API Ключи</h2>
                <div id="envVars"></div>
                <button onclick="saveEnv()">💾 Сохранить изменения</button>
            </div>

            <!-- Settings -->
            <div class="card">
                <h2>⚙️ Настройки</h2>
                <div id="settingsBox"></div>
            </div>

            <!-- Logs -->
            <div class="card">
                <h2>📋 Логи сервера</h2>
                <div class="log-box" id="logBox">Загрузка логов...</div>
                <button onclick="loadLogs()">🔄 Обновить</button>
            </div>

            <!-- Files -->
            <div class="card">
                <h2>📁 Сгенерированные файлы</h2>
                <table id="filesTable">
                    <thead>
                        <tr><th>Имя</th><th>Размер</th><th>Действия</th></tr>
                    </thead>
                    <tbody id="filesBody"></tbody>
                </table>
                <button onclick="loadFiles()">🔄 Обновить</button>
            </div>
        </div>
    </div>

    <script>
        // Load environment variables
        async function loadEnv() {
            try {
                const resp = await fetch('/api/env');
                const data = await resp.json();
                const div = document.getElementById('envVars');
                div.innerHTML = '';
                for (const [key, value] of Object.entries(data)) {
                    div.innerHTML += `
                        <label>${key}</label>
                        <input type="text" id="env_${key}" value="${value}">
                    `;
                }
            } catch(e) {
                console.error('Failed to load env:', e);
            }
        }

        // Save environment variables
        async function saveEnv() {
            const data = {};
            document.querySelectorAll('[id^="env_"]').forEach(input => {
                const key = input.id.replace('env_', '');
                data[key] = input.value;
            });

            try {
                const resp = await fetch('/api/env', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await resp.json();
                showStatus('✅ Переменные сохранены!', 'success');
            } catch(e) {
                showStatus('❌ Ошибка сохранения', 'error');
            }
        }

        // Load settings
        async function loadSettings() {
            try {
                const resp = await fetch('/api/settings');
                const data = await resp.json();
                const div = document.getElementById('settingsBox');
                div.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch(e) {
                console.error('Failed to load settings:', e);
            }
        }

        // Load logs
        async function loadLogs() {
            try {
                const resp = await fetch('/api/logs');
                const data = await resp.json();
                document.getElementById('logBox').textContent = data.logs.join('\n');
            } catch(e) {
                console.error('Failed to load logs:', e);
            }
        }

        // Load files
        async function loadFiles() {
            try {
                const resp = await fetch('/api/files');
                const data = await resp.json();
                const tbody = document.getElementById('filesBody');
                tbody.innerHTML = '';
                data.files.forEach(f => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${f.name}</td>
                            <td>${f.size_kb.toFixed(1)} KB</td>
                            <td><button onclick="deleteFile('${f.name}')">🗑</button></td>
                        </tr>
                    `;
                });
            } catch(e) {
                console.error('Failed to load files:', e);
            }
        }

        // Delete file
        async function deleteFile(filename) {
            if (!confirm(`Удалить ${filename}?`)) return;
            try {
                const resp = await fetch(`/api/delete/${filename}`, {method: 'POST'});
                const data = await resp.json();
                if (data.success) {
                    showStatus(`✅ ${filename} удалён`, 'success');
                    loadFiles();
                }
            } catch(e) {
                showStatus('❌ Ошибка удаления', 'error');
            }
        }

        // Show status message
        function showStatus(msg, type) {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = msg;
            document.querySelector('.container').insertBefore(div, document.querySelector('.grid'));
            setTimeout(() => div.remove(), 3000);
        }

        // Auto-refresh every 10 seconds
        setInterval(loadLogs, 10000);
        setInterval(loadFiles, 10000);

        // Initial load
        window.addEventListener('DOMContentLoaded', () => {
            loadEnv();
            loadSettings();
            loadLogs();
            loadFiles();
        });
    </script>
</body>
</html>
