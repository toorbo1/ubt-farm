<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBT Traffic Farm - Веб-приложение</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        header h1 { font-size: 2em; margin-bottom: 10px; }
        .main-content {
            display: grid;
            grid-template-columns: 350px 1fr;
            min-height: 600px;
        }
        .sidebar {
            background: #f8f9fa;
            padding: 20px;
            border-right: 1px solid #dee2e6;
        }
        .content {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.3s;
        }
        button:hover { background: #5568d3; }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #dee2e6;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab.active {
            border-bottom-color: #667eea;
            color: #667eea;
            font-weight: 600;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .gallery-item {
            border: 2px solid #dee2e6;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .gallery-item:hover {
            transform: scale(1.05);
        }
        .gallery-item img, .gallery-item video {
            width: 100%;
            height: 320px;
            object-fit: cover;
        }
        .gallery-item .label {
            padding: 8px;
            text-align: center;
            font-size: 12px;
            background: #f8f9fa;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        .log {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .status {
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: center;
        }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.running { background: #fff3cd; color: #856404; }
        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 UBT Traffic Farm</h1>
            <p>Автоматическая генерация видео с ИИ</p>
        </header>

        <div class="main-content">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="form-group">
                    <label>Тема видео:</label>
                    <input type="text" id="topic" value="космос и звёзды" placeholder="Введите тему...">
                </div>

                <button onclick="generateScript()">📝 Сценарий</button>
                <button onclick="generateImage()">🖼 Картинка</button>
                <button onclick="generateVideo()">🎬 Видео (3с)</button>
                <button onclick="generateFullPipeline()" id="fullBtn">▶ Полный цикл</button>

                <div id="progressContainer" style="display:none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressBar" style="width: 0%">0%</div>
                    </div>
                </div>

                <div id="status"></div>
            </div>

            <!-- Content -->
            <div class="content">
                <div class="tabs">
                    <div class="tab active" data-tab="script">Сценарий</div>
                    <div class="tab" data-tab="gallery">Галерея</div>
                    <div class="tab" data-tab="video">Видео</div>
                    <div class="tab" data-tab="log">Лог</div>
                </div>

                <div id="scriptTab" class="tab-content active">
                    <textarea id="scriptText" placeholder="Здесь появится сценарий..."></textarea>
                </div>

                <div id="galleryTab" class="tab-content">
                    <div class="gallery" id="gallery"></div>
                </div>

                <div id="videoTab" class="tab-content">
                    <div id="videoContainer"></div>
                </div>

                <div id="logTab" class="tab-content">
                    <div class="log" id="logBox">Логи будут здесь...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTaskId = null;

        // Загрузка галереи при старте
        window.addEventListener('DOMContentLoaded', loadGallery);

        // Переключение вкладок
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + 'Tab').classList.add('active');
                if (tab.dataset.tab === 'gallery') loadGallery();
            });
        });

        function log(msg) {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function showStatus(msg, type='success') {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.textContent = msg;
        }

        async function generateScript() {
            const topic = document.getElementById('topic').value;
            log('Генерация сценария...');

            try {
                const resp = await fetch('/api/script', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({topic})
                });
                const data = await resp.json();

                document.getElementById('scriptText').value = data.full_text;
                log(`✅ Сценарий готов: ${data.scenes.length} сцен`);
                showStatus('Сценарий создан!');
            } catch(e) {
                log('❌ Ошибка: ' + e.message);
                showStatus('Ошибка генерации', 'error');
            }
        }

        async function generateImage() {
            const topic = document.getElementById('topic').value;
            const prompt = `Detailed 2D pixel art, 16-bit retro game aesthetic, black cat with green eyes, cyberpunk, ${topic}, 9:16`;
            log('Генерация картинки...');

            try {
                const resp = await fetch('http://localhost:5001/api/image', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt, seed: Math.floor(Math.random()*1000)})
                });
                const data = await resp.json();

                // Add to gallery immediately
                const gallery = document.getElementById('gallery');
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `<img src="${data.path}"><div class="label">Generated</div>`;
                gallery.appendChild(item);

                log(`✅ Картинка готова (${data.size_kb.toFixed(1)} KB)`);
                showStatus('Картинка создана! Открой вкладку "Галерея"');
            } catch(e) {
                log('❌ Ошибка: ' + e.message);
                showStatus('Ошибка генерации', 'error');
            }
        }

        async function generateVideo() {
            const topic = document.getElementById('topic').value;
            const prompt = `pixel art ${topic}`;
            log('Генерация видео...');

            try {
                const resp = await fetch('/api/video', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt, duration: 3})
                });
                const data = await resp.json();

                document.getElementById('videoContainer').innerHTML =
                    `<video controls autoplay><source src="${data.video_path}" type="video/mp4"></video>`;
                log(`✅ Видео готово (${data.size_mb.toFixed(2)} MB)`);
                showStatus('Видео создано! Открой вкладку "Видео"');
            } catch(e) {
                log('❌ Ошибка: ' + e.message);
                showStatus('Ошибка генерации', 'error');
            }
        }

        async function generateFullPipeline() {
            const topic = document.getElementById('topic').value;
            const btn = document.getElementById('fullBtn');
            btn.disabled = true;
            document.getElementById('progressContainer').style.display = 'block';
            log('Запуск полного цикла...');

            try {
                const resp = await fetch('/api/full-pipeline', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({topic})
                });
                const data = await resp.json();
                currentTaskId = data.task_id;

                checkProgress();
            } catch(e) {
                log('❌ Ошибка запуска: ' + e.message);
                btn.disabled = false;
            }
        }

        async function checkProgress() {
            if (!currentTaskId) return;

            const resp = await fetch(`/api/task-status/${currentTaskId}`);
            const task = await resp.json();

            document.getElementById('progressBar').style.width = task.progress + '%';
            document.getElementById('progressBar').textContent = task.progress + '%';

            if (task.status === 'completed') {
                showStatus(`Видео готово! (${task.result.size_mb.toFixed(2)} MB)`);
                document.getElementById('videoContainer').innerHTML =
                    `<video controls autoplay><source src="${task.result.video_path}" type="video/mp4"></video>`;
                log('✅ Полный цикл завершён!');
                document.getElementById('fullBtn').disabled = false;
                currentTaskId = null;
            } else if (task.status === 'failed') {
                showStatus('Ошибка: ' + task.error, 'error');
                log('❌ Ошибка полного цикла');
                document.getElementById('fullBtn').disabled = false;
            } else {
                setTimeout(checkProgress, 2000);
            }
        }

        function addToGallery(path, label) {
            const gallery = document.getElementById('gallery');
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
                <img src="${path}" alt="${label}">
                <div class="label">${label}</div>
            `;
            gallery.appendChild(item);
        }

        async function loadGallery() {
            try {
                const resp = await fetch('/api/gallery');
                const data = await resp.json();

                const gallery = document.getElementById('gallery');
                gallery.innerHTML = '';

                // Картинки
                data.images.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    div.innerHTML = `
                        <img src="${item.url}">
                        <div class="label">${item.name}</div>
                        <button onclick="deleteFile('${item.name}')" style="width:100%;background:#dc3545;color:white;border:none;padding:5px;cursor:pointer;">🗑 Удалить</button>
                    `;
                    gallery.appendChild(div);
                });

                // Видео
                data.videos.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    div.innerHTML = `
                        <video controls><source src="${item.url}"></video>
                        <div class="label">${item.name}</div>
                        <button onclick="deleteFile('${item.name}')" style="width:100%;background:#dc3545;color:white;border:none;padding:5px;cursor:pointer;">🗑 Удалить</button>
                    `;
                    gallery.appendChild(div);
                });

                log(`Галерея загружена: ${data.images.length} картинок, ${data.videos.length} видео`);
            } catch(e) {
                log('Ошибка загрузки галереи: ' + e.message);
            }
        }

        async function deleteFile(filename) {
            if (!confirm(`Удалить файл ${filename}?`)) return;

            try {
                const resp = await fetch(`/api/delete/${filename}`, {method: 'POST'});
                const data = await resp.json();

                if (data.success) {
                    log(`✅ Файл ${filename} удалён`);
                    loadGallery(); // Обновить галерею
                } else {
                    log(`❌ Ошибка удаления: ${data.message}`);
                }
            } catch(e) {
                log(`❌ Ошибка удаления: ${e.message}`);
            }
        }
    </script>
</body>
</html>
