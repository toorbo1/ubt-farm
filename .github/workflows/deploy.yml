name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Ручной запуск

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
        ssh-keyscan -H ${{ secrets.SERVER_IP || '144.31.25.159' }} >> ~/.ssh/known_hosts

    - name: Deploy to server
      env:
        SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
        SERVER_HOST: ${{ secrets.SERVER_IP || '144.31.25.159' }}
      run: |
        ssh -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -i ~/.ssh/id_rsa \
            ${SERVER_USER}@${SERVER_HOST} << 'EOF'
          cd /opt/ubt-farm

          # Сохраняем бекап перед обновлением
          BACKUP_DIR="/opt/ubt-farm/backups/deploy_$(date +%Y%m%d_%H%M%S)"
          mkdir -p "$BACKUP_DIR"
          cp bot/*.py "$BACKUP_DIR/" 2>/dev/null || true
          echo "Бэкап создан: $BACKUP_DIR"

          # Pull последних изменений
          git pull origin main

          # Установка Python зависимостей
          if [ -f requirements.txt ]; then
            source venv/bin/activate
            pip install -q -r requirements.txt
          fi

          # Перезапуск бота (Python)
          pm2 restart ubt-bot1 ubt-bot2 || pm2 restart all

          echo "Деплой завершен успешно!"
          pm2 logs --lines 10
        EOF
