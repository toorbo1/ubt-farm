name: Test SSH Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "Key format:"
        head -1 ~/.ssh/id_rsa

    - name: Test SSH connection
      run: |
        ssh -vvv -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -i ~/.ssh/id_rsa \
            root@144.31.25.159 \
            "echo 'SSH connection successful!'"
